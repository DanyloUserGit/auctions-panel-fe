name: Auto Deploy auctions-panel-fe

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/auctions/auctions-panel-fe
            git config --global --add safe.directory /var/www/auctions/auctions-panel-fe
            git reset --hard
            git clean -fd
            git pull origin main
            npm ci
            npm run build
            sudo systemctl reload nginx
